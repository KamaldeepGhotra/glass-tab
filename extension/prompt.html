<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Glass Tab</title>
  <link rel="stylesheet" href="prompt.css">
</head>
<body>
  <div class="card">
    <img src="icons/icon48.png" alt="" width="36" height="36">
    <h1>Make Google match your glass?</h1>
    <p>Glass Tab can give your search results the same glass look as your new tab. Chrome will ask to let it change google.com.</p>
    <div class="row">
      <button id="no" class="ghost">No thanks</button>
      <button id="yes" class="primary">Turn on</button>
    </div>
    <p class="small">We won't ask again. You can always change this in Glass Tab settings.</p>
  </div>
  <script src="gg.js"></script>
  <script src="prompt.js"></script>
</body>
</html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Glass Tab promo</title>
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; }
  #bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .card { position: absolute; left: 34px; right: 34px; top: 58px; height: 164px; border-radius: 28px;
    background: rgba(255,255,255,.12); backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
    border: 1px solid rgba(255,255,255,.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 18px 40px rgba(0,0,0,.35);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .time { font-size: 64px; font-weight: 600; line-height: 1; letter-spacing: -1px; color: rgba(255,255,255,.18); -webkit-text-stroke: 1.5px rgba(255,255,255,.85); font-family: "Avenir Next Condensed", "SF Pro Display", sans-serif; }
  h1 { margin: 10px 0 2px; font-size: 26px; font-weight: 600; letter-spacing: -.3px; }
  p { margin: 0; font-size: 14px; opacity: .85; }
</style></head>
<body><div id="bg"></div>
<div class="card"><div class="time">9:41</div><h1>Glass Tab</h1><p>Liquid glass for your new tab</p></div>
<script>
function waveParts(tones) {
  const n = tones.length, span = 1900 / n;
  // On dark wallpapers shadows need to be deeper and rims fainter to read the same.
  const dark = parseInt(tones[n - 1].slice(1, 3), 16) < 100;
  const rim = dark ? '.09' : '.22', shade = dark ? '.6' : '.32';
  const bands = [`<rect x="-800" y="-900" width="3200" height="2800" fill="${tones[0]}"/>`];
  for (let i = 1; i < n; i++) {
    const y0 = 1450 - i * span, ph = i * 1.7;
    const pts = [];
    for (let x = -800; x <= 2400; x += 12) {
      const y = y0 + 90 * Math.sin(x / 110 + ph) + 30 * Math.sin(x / 47 + ph * 2.3);
      pts.push(`${x} ${y.toFixed(1)}`);
    }
    bands.push(`<path d="M-800 -900L${pts.join('L')}L2400 -900Z" fill="${tones[i]}" filter="url(#s)" stroke="rgba(255,255,255,${rim})" stroke-width="3"/>`);
  }
  const svg = (inner) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">`
    + `<defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="-8" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="${shade}"/></filter></defs>`
    + `<g transform="rotate(30 800 500)">${inner}</g></svg>`;
  return { bands, svg };
}
function waveURL(tones) {
  const key = tones.join();
  if (waveCache[key]) return waveCache[key];
  const { bands, svg } = waveParts(tones);
  return (waveCache[key] = `url("data:image/svg+xml,${encodeURIComponent(svg(bands.join('')))}")`);
}

const { bands, svg } = waveParts(['#e0488a', '#c23a76', '#9f2d61', '#7c214c', '#5a1738', '#3a0f25', '#200815'].reverse().reverse());
document.getElementById('bg').style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(svg(bands.join('')))}")`;
</script></body></html>
